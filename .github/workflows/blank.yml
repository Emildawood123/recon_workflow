      - name: Send Important Nuclei Results to Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          REPORT="scan_results/arc.io_nuclei_report.txt"
          SUBDOMAINS="scan_results/arc.io_subdomains.txt"

          if [ -f "$SUBDOMAINS" ]; then
            SUB_COUNT=$(grep -cve '^[[:space:]]*$' "$SUBDOMAINS" || true)
          else
            SUB_COUNT=0
          fi

          if [ -f "$REPORT" ]; then

            TOTAL=$(grep -cve '^[[:space:]]*$' "$REPORT" || true)

            CRITICAL=$(grep -i '\[critical\]' "$REPORT" | wc -l | tr -d ' ')
            HIGH=$(grep -i '\[high\]' "$REPORT" | wc -l | tr -d ' ')
            MEDIUM=$(grep -i '\[medium\]' "$REPORT" | wc -l | tr -d ' ')

            IMPORTANT=$(grep -iE '\[(critical|high|medium)\]' "$REPORT" || true)

            if [ -z "$IMPORTANT" ]; then

              MESSAGE="✅ arc.io Scan Completed

          🔎 Subdomains: $SUB_COUNT
          🚨 Important findings: 0
          📊 Critical: $CRITICAL | High: $HIGH | Medium: $MEDIUM
          ℹ️ Total findings: $TOTAL

          No medium/high/critical findings detected."

            else

              MESSAGE="🚨 arc.io Important Findings

          🔎 Subdomains: $SUB_COUNT

          🔴 Critical: $CRITICAL
          🟠 High: $HIGH
          🟡 Medium: $MEDIUM

          🔗 Findings:

          $IMPORTANT"

            fi

          else

            MESSAGE="❌ arc.io Scan Failed

          Nuclei report was not generated.

          🔎 Subdomains found: $SUB_COUNT"

          fi

          # Telegram limit protection
          echo "$MESSAGE" | split -C 3500 - /tmp/telegram_part_

          for PART in /tmp/telegram_part_*; do

            curl -sS -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=$(cat "$PART")"

            echo ""

          done